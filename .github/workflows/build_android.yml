name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerar arquivo .env com a chave Firebase (GitHub Secret)
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          echo "FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY}" > .env

      - name: Executar Testes Unitarios (pytest)
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests
          python -m pytest tests/ -v

      - name: Cache do Buildozer (acelera compilacoes futuras)
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-v1-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-v1-

      - name: Instalar Dependencias Linux e Java 17 (Android SDK/NDK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake \
            gettext libltdl-dev patch

      - name: Instalar Buildozer e Cython
        run: |
          python -m pip install --upgrade pip "setuptools<70" wheel
          pip install "cython==0.29.36" buildozer

      - name: Compilar APK com Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Publicar Artefato APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: tarot-mistico-apk
          path: bin/*.apk
