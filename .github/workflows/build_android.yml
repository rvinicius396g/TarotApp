name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java 17 (Exigido pelo Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Gerar arquivo .env com a chave Firebase (GitHub Secret)
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          echo "FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY}" > .env

      - name: Executar Testes Unitarios (pytest)
        run: |
          python -m pip install --upgrade "pip<25"
          pip install pytest requests
          python -m pytest tests/ -v

      - name: Restaurar Cache do Buildozer
        uses: actions/cache/restore@v4
        id: cache-buildozer
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-v3-
            buildozer-${{ runner.os }}-v2-

      - name: Instalar Dependencias Linux (Android SDK/NDK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake \
            gettext libltdl-dev patch libsqlite3-dev

      - name: Instalar Buildozer e Cython com restricao de versoes estaveis
        run: |
          cat << 'EOF' > $HOME/pip-constraints.txt
          pip==24.0
          setuptools<70
          wheel<0.45
          cython==0.29.36
          virtualenv<20.26
          EOF
          echo "PIP_CONSTRAINT=$HOME/pip-constraints.txt" >> $GITHUB_ENV
          echo "VIRTUALENV_NO_PERIODIC_UPDATE=1" >> $GITHUB_ENV
          python -m pip install -c $HOME/pip-constraints.txt --upgrade pip setuptools wheel virtualenv
          pip install -c $HOME/pip-constraints.txt "cython==0.29.36" buildozer

      - name: Compilar APK com Buildozer
        run: |
          yes | buildozer -v android debug || [ -n "$(ls bin/*.apk 2>/dev/null)" ]

      - name: Salvar Cache do Buildozer
        uses: actions/cache/save@v4
        if: always() && steps.cache-buildozer.outputs.cache-hit != 'true'
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-v3-${{ hashFiles('buildozer.spec') }}

      - name: Publicar Artefato APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: tarot-mistico-apk
          path: bin/*.apk
          if-no-files-found: error
